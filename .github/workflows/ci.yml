name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore tests/ItemSpawnerEnhanced.Core.Tests/ItemSpawnerEnhanced.Core.Tests.csproj

      - name: Run core tests
        run: dotnet test tests/ItemSpawnerEnhanced.Core.Tests/ItemSpawnerEnhanced.Core.Tests.csproj -c Release --no-restore --nologo

